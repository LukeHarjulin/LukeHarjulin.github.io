name = "spotify-listening-stats"
main = "workers/spotify-stats/src/index.ts"
compatibility_date = "2026-08-27"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "spotify-api.lukeharjulin.com"
custom_domain = true

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
PUBLIC_SITE_ORIGIN = "https://www.lukeharjulin.com"
# Enable after applying migration 0005 and setting the LASTFM_API_KEY secret.
RECOMMENDATIONS_ENABLED = "true"

[secrets]
required = [
	"LISTENING_PASSPHRASE",
	"LISTENING_SESSION_SECRET",
	"SPOTIFY_CLIENT_ID",
	"SPOTIFY_CLIENT_SECRET",
	"SPOTIFY_REFRESH_TOKEN",
	"LASTFM_API_KEY",
]

[[d1_databases]]
binding = "DB"
database_name = "spotify-listening"
database_id = "<D1_DATABASE_ID>"
migrations_dir = "workers/spotify-stats/migrations"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
